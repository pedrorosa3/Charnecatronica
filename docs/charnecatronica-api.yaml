                lojaNipc:
                  type: string
                  example: "123456789"
                  description: NIPC da loja onde a venda ocorreu
                Cod_barras:
                  type: string
                  example: "9781234567890"
                  description: Código de barras do equipamento vendido
                marca:
                  type: string
                  example: "Sony"
                  description: Marca do equipamento
                modelo:
                  type: string
                  example: "Xperia Z"
                  description: Modelo do equipamento
                metodoPagamento:
                  type: string
                  example: "Dinheiro"
                  description: Método de pagamento utilizado
      responses:
        '201':
          description: Venda criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Venda física realizada com sucesso."
                  vendaId:
                    type: integer
                    example: 789
        '400':
          description: Dados inválidos ou recursos não encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Cliente não encontrado."
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Erro interno ao criar venda física."
  
