  /interesses:
    get:
      summary: Obter interesses do cliente pelo email
      description: Retorna lista de interesses associados ao cliente identificado pelo email, incluindo disponibilidade dos equipamentos.
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email do cliente
      responses:
        '200':
          description: Lista de interesses retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponiveis:
                    type: integer
                    description: Número de interesses disponíveis para venda
                    example: 3
                  interesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        data:
                          type: string
                          format: date-time
                          example: "2025-06-19T12:34:56Z"
                        lojanipc:
                          type: string
                          example: "123456789"
                        codbarras:
                          type: string
                          example: "ABC123XYZ"
                        marca:
                          type: string
                          example: "Samsung"
                        modelo:
                          type: string
                          example: "Galaxy S20"
                        tipo:
                          type: string
                          example: "Smartphone"
                        precobase:
                          type: number
                          format: float
                          example: 599.99
                        anolancamento:
                          type: integer
                          example: 2020
                        disponivel:
                          type: boolean
                          description: Indica se o equipamento está disponível para venda
                          example: true
        '400':
          description: Email não fornecido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Email não fornecido"
        '404':
          description: Pessoa ou cliente não encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Pessoa não encontrada"
        '500':
          description: Erro interno ao buscar interesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao buscar interesses"

    post:
      summary: Adicionar novo interesse para um cliente
      description: Adiciona um interesse de equipamento (marca + modelo) para o cliente identificado pelo email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - marca
                - modelo
              properties:
                email:
                  type: string
                  format: email
                  example: "cliente@example.com"
                marca:
                  type: string
                  example: "Apple"
                modelo:
                  type: string
                  example: "iPhone 13"
      responses:
        '201':
          description: Interesse adicionado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Interesse adicionado com sucesso"
        '400':
          description: Campos obrigatórios em falta
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Campos obrigatórios em falta."
        '404':
          description: Pessoa, cliente ou equipamento não encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Pessoa não encontrada"
        '500':
          description: Erro interno ao adicionar interesse
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao adicionar interesse"

  /interesses/{id}:
    delete:
      summary: Remover interesse pelo ID
      description: Remove o interesse especificado pelo seu ID.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do interesse a remover
      responses:
        '200':
          description: Interesse removido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Interesse removido com sucesso."
        '500':
          description: Erro interno ao remover interesse
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao remover interesse."
                    
  /create-payment-intent:
    post:
      summary: Cria um PaymentIntent Stripe para pagamento com cartão
      description: |
        Cria um PaymentIntent para pagamentos com cartão via Stripe. Para outros métodos (ex: mbway), retorna mensagem indicando que não é necessário PaymentIntent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - metodoPagamento
              properties:
                amount:
                  type: number
                  description: Montante do pagamento em euros
                  example: 49.99
                metodoPagamento:
                  type: string
                  description: Método de pagamento
                  example: "cartao"
      responses:
        '200':
          description: PaymentIntent criado ou mensagem de método alternativo
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      clientSecret:
                        type: string
                        description: Client secret do PaymentIntent Stripe
                        example: pi_1JRKLkL6a...
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Método não necessita PaymentIntent."
        '400':
          description: Parâmetros inválidos ou em falta
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Montante ou método não fornecido."
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao processar pagamento."                  




















