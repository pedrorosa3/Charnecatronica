openapi: 3.0.3
info:
  title: Charnecatronica
  version: 1.0.0
  description: API para gerir equipamentos, clientes e projetos
servers:
  - url: http://localhost:9000
paths:
  /perfil:
    post:
      summary: Criar ou atualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - nif
                - nic
                - genero
                - telemovel
                - dataNascimento
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                nif:
                  type: integer
                nic:
                  type: integer
                genero:
                  type: string
                telemovel:
                  type: number
                dataNascimento:
                  type: string
                  format: date
      responses:
        '200':
          description: Perfil atualizado
        '201':
          description: Perfil criado
        '400':
          description: Dados em falta
        '500':
          description: Erro no servidor

    get:
      summary: Buscar perfil por email
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email do utilizador
      responses:
        '200':
          description: Perfil encontrado
        '400':
          description: Email em falta
        '404':
          description: Perfil não encontrado
        '500':
          description: Erro no servidor

  /perfil/clienteId:
    get:
      summary: Obter ID do cliente por email
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
      responses:
        '200':
          description: ID do cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  clienteId:
                    type: integer
        '400':
          description: Email em falta
        '404':
          description: Cliente não encontrado
        '500':
          description: Erro no servidor

  /perfil/email:
    post:
      summary: Buscar ou criar utilizador por email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                nome:
                  type: string
                  default: Utilizador
      responses:
        '200':
          description: Utilizador já existente
        '201':
          description: Novo utilizador criado
        '400':
          description: Email em falta
        '500':
          description: Erro no servidor
  
  /equipamentos:
    get:
      summary: Obter todos os equipamentos à venda
      responses:
        '200':
          description: Lista de equipamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    estado:
                      type: string
                    estadoVenda:
                      type: string
                    preco:
                      type: number
                    numeroSequenciaLoja:
                      type: string
                    dataDeDisponibilizacao:
                      type: string
                      format: date-time
                    lojanipc:
                      type: string
                    marca:
                      type: string
                    modelo:
                      type: string
                    tipo:
                      type: string
                    codBarras:
                      type: string
                    imagem:
                      type: string
                    nome:
                      type: string
                    categoria:
                      type: string
                    avaliacao:
                      type: number
                    reviews:
                      type: string
        '500':
          description: Erro ao buscar equipamentos

    post:
      summary: Criar novo equipamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
                - preco
                - lojaNipc
                - codBarras
                - marca
                - modelo
                - tipo
                - precoBase
                - anoLancamento
                - imagemurl
              properties:
                estado:
                  type: string
                preco:
                  type: number
                lojaNipc:
                  type: integer
                codBarras:
                  type: string
                marca:
                  type: string
                modelo:
                  type: string
                tipo:
                  type: string
                precoBase:
                  type: number
                anoLancamento:
                  type: integer
                imagemurl:
                  type: string
                compraId:
                  type: integer
      responses:
        '201':
          description: Equipamento criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
        '400':
          description: Campos obrigatórios em falta
        '500':
          description: Erro ao criar equipamento

  /equipamentos/{id}:
    get:
      summary: Obter equipamento por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do equipamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  estado:
                    type: string
                  estadoVenda:
                    type: string
                  preco:
                    type: number
                  numeroSequenciaLoja:
                    type: string
                  dataDeDisponibilizacao:
                    type: string
                    format: date-time
                  lojanipc:
                    type: string
                  codBarras:
                    type: string
                  marca:
                    type: string
                  modelo:
                    type: string
                  tipo:
                    type: string
                  precoBase:
                    type: number
                  anoLancamento:
                    type: integer
                  nome:
                    type: string
                  categoria:
                    type: string
                  imagens:
                    type: array
                    items:
                      type: string
                  especificacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        titulo:
                          type: string
                        destaque:
                          type: string
                  avaliacao:
                    type: number
                  reviews:
                    type: string
        '404':
          description: Equipamento não encontrado
        '500':
          description: Erro interno ao buscar equipamento        
          
  /compras:
    post:
      summary: Registar uma nova compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estadocompra
                - preco
                - clienteid
                - empregadoid
                - lojaNipc
                - estado
                - metodopagamento
                - codbarras
              properties:
                preco:
                  type: number
                clienteId:
                  type: integer
                empregadoId:
                  type: integer
                lojaNipc:
                  type: integer
                estado:
                  type: string
                modelo:
                  type: string
                metodoPagamento:
                  type: string
                estadocompra:
                  type: string
                  default: "Por vender"
                
      responses:
        '201':
            description: Compra registada com sucesso
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                    compra:
                      type: object
                      properties:
                        id:
                          type: integer
                          
                        estadocompra:
                          type: string
                          
                        data:
                          type: string
                          format: date-time
                        
                        preco:
                          type: number
                        clienteid:
                          type: integer
                        empregadoid:
                          type: integer
                        lojanipc:
                          type: integer
                        estado:
                          type: string
                        metodopagamento:
                          type: string
                        codbarras:
                          type: string
                        
        '400':
          description: Campos obrigatórios em falta
        '404':
          description: Modelo não encontrado
        '500':
          description: Erro
          
  /compraslista:
    get:
      summary: Obter lista de compras
      responses:
        '200':
          description: Lista de compras obtida com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    data:
                      type: string
                      format: date-time
                    preco:
                      type: number
                    estadocompra:
                      type: string
                    clienteId:
                      type: integer
                    clienteNome:
                      type: string
                    empregadoId:
                      type: integer
                    empregadoNome:
                      type: string
                    lojaNome:
                      type: string
                    lojaNipc:
                      type: string
                    equipamentoCodBarras:
                      type: string
                    equipamentoMarca:
                      type: string
                    equipamentoModelo:
                      type: string
        '500':
          description: Erro ao buscar compras

  /compraslista/{id}:
    get:
      summary: Obter detalhes de uma compra por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da compra
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  data:
                    type: string
                    format: date-time
                  preco:
                    type: number
                  estado:
                    type: string
                  metodoPagamento:
                    type: string
                  estadocompra:
                    type: string
                  clienteId:
                    type: integer
                  clienteNome:
                    type: string
                  clienteEmail:
                    type: string
                  clienteTelemovel:
                    type: string
                  clienteRua:
                    type: string
                  clienteLocalidade:
                    type: string
                  empregadoId:
                    type: integer
                  empregadoNome:
                    type: string
                  empregadoEmail:
                    type: string
                  empregadoTelemovel:
                    type: string
                  lojaNome:
                    type: string
                  lojaNipc:
                    type: string
                  lojaTelefone:
                    type: string
                  lojaRua:
                    type: string
                  lojaNumero:
                    type: string
                  lojaLocalidade:
                    type: string
                  lojaConcelho:
                    type: string
                  lojaDistrito:
                    type: string
                  lojaCodigoPostal:
                    type: string
                  equipamentoCodBarras:
                    type: string
                  equipamentoMarca:
                    type: string
                  equipamentoModelo:
                    type: string
                  equipamentoTipo:
                    type: string
                  equipamentoAnoLancamento:
                    type: integer
                  equipamentoImagemUrl:
                    type: string
        '404':
          description: Compra não encontrada
        '500':
          description: Erro ao buscar compra por ID        
          
  /login:
    post:
      summary: Efetuar login
      description: Autentica um utilizador com email e password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: joao.silva@example.com
                password:
                  type: string
                  format: password
                  example: 123456
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login bem-sucedido
                  userId:
                    type: integer
                    example: 12
                  nome:
                    type: string
                    example: João Silva
                  email:
                    type: string
                    format: email
                    example: joao.silva@example.com
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Senha incorreta ou E-mail não encontrado
        '500':
          description: Erro interno ao tentar fazer login
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Erro ao fazer login        
          
  /projetos_beneficencia:
    get:
      summary: Listar todos os projetos de beneficência
      description: Retorna uma lista de todos os projetos de beneficência com informações da loja e organizador.
      responses:
        '200':
          description: Lista de projetos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjetoBeneficenciaResumo'
        '500':
          description: Erro ao buscar projetos

  /projetos_beneficencia/{id}:
    get:
      summary: Obter detalhes de um projeto de beneficência por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Projeto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoBeneficenciaDetalhado'
        '400':
          description: ID inválido
        '404':
          description: Projeto não encontrado
        '500':
          description: Erro no servidor

 
  /adicionar-projeto:
    post:
      summary: Criar um novo projeto de beneficência
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - descricao
                - datalimite
                - quantidadeequipamentos
                - nomeorganizador
                - nomeloja
                - fichaequipamentocodbarras
              properties:
                nome:
                  type: string
                  example: "Projeto Solidário"
                descricao:
                  type: string
                  example: "Descrição do projeto de beneficência"
                datalimite:
                  type: string
                  format: date
                  example: "2025-12-31"
                quantidadeequipamentos:
                  type: integer
                  example: 50
                nomeorganizador:
                  type: string
                  example: "Maria Fernandes"
                nomeloja:
                  type: string
                  example: "Loja Central"
                fichaequipamentocodbarras:
                  type: string
                  example: "1234567890123"
                imagem:
                  type: string
                  example: "https://exemplo.com/imagem.jpg"
      responses:
        '201':
          description: Projeto registrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Projeto registrado com sucesso!"
                  projeto:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nome:
                        type: string
                        example: "Projeto Solidário"
                      descricao:
                        type: string
                        example: "Descrição do projeto de beneficência"
                      datalimite:
                        type: string
                        format: date
                        example: "2025-12-31"
                      quantidadeequipamentos:
                        type: integer
                        example: 50
                      organizadorid:
                        type: integer
                        example: 3
                      lojanipc:
                        type: string
                        example: "509876321"
                      fichaequipamentocodbarras:
                        type: string
                        example: "1234567890123"
                      imagem:
                        type: string
                        example: "https://exemplo.com/imagem.jpg"
        '400':
          description: Campos obrigatórios em falta ou organizador/loja não encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Todos os campos são obrigatórios"
        '500':
          description: Erro interno ao registrar projeto
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao registrar projeto" 

  /lojas:
    post:
      summary: Criar uma nova loja com morada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - numerotelefone
                - email
                - horarioabertura
                - horariofecho
                - morada
              properties:
                nome:
                  type: string
                  example: "Loja Central"
                numerotelefone:
                  type: string
                  example: "+351912345678"
                email:
                  type: string
                  format: email
                  example: "contato@lojacentral.pt"
                horarioabertura:
                  type: string
                  example: "09:00"
                horariofecho:
                  type: string
                  example: "18:00"
                morada:
                  type: object
                  required:
                    - pais
                    - localidade
                    - rua
                  properties:
                    pais:
                      type: string
                      example: "Portugal"
                    localidade:
                      type: string
                      example: "Lisboa"
                    latitude:
                      type: number
                      format: float
                      example: 38.7169
                    longitude:
                      type: number
                      format: float
                      example: -9.1399
                    freguesia:
                      type: string
                      example: "Santo António"
                    rua:
                      type: string
                      example: "Rua Augusta"
                    codigopostal:
                      type: string
                      example: "1100-048"
                    concelho:
                      type: string
                      example: "Lisboa"
                    numero:
                      type: string
                      example: "45"
                    distrito:
                      type: string
                      example: "Lisboa"
      responses:
        '201':
          description: Loja criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Loja criada com sucesso!"
                  loja:
                    type: object
                    properties:
                      nipc:
                        type: string
                        example: "123456789"
                      nome:
                        type: string
                        example: "Loja Central"
                      numerotelefone:
                        type: string
                        example: "+351912345678"
                      email:
                        type: string
                        format: email
                        example: "contato@lojacentral.pt"
                      moradaid:
                        type: integer
                        example: 10
                      horaabertura:
                        type: string
                        example: "09:00"
                      horafecho:
                        type: string
                        example: "18:00"
        '400':
          description: Campos obrigatórios em falta ou inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Campos obrigatórios em falta."
        '500':
          description: Erro interno ao criar loja
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro interno ao criar loja"

    get:
      summary: Obter todas as lojas com detalhes e morada
      responses:
        '200':
          description: Lista de lojas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    nipc:
                      type: string
                      example: "123456789"
                    nome:
                      type: string
                      example: "Loja Central"
                    telefone:
                      type: string
                      example: "+351912345678"
                    email:
                      type: string
                      format: email
                      example: "contato@lojacentral.pt"
                    horario:
                      type: string
                      example: "09:00 - 18:00"
                    morada:
                      type: string
                      example: "Rua Augusta, 45, Lisboa"
                    posicao:
                      type: object
                      properties:
                        lat:
                          type: number
                          format: float
                          example: 38.7169
                        lng:
                          type: number
                          format: float
                          example: -9.1399
        '500':
          description: Erro ao buscar lojas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao buscar lojas"

  /lojas/{nipc}/empregados:
    get:
      summary: Obter empregados de uma loja pelo NIPC
      parameters:
        - name: nipc
          in: path
          required: true
          schema:
            type: string
          description: NIPC da loja
      responses:
        '200':
          description: Lista de empregados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 5
                    nome:
                      type: string
                      example: "José Silva"
        '500':
          description: Erro ao buscar empregados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao buscar empregados da loja"

  /lojas/{nipc}/equipamentos:
    get:
      summary: Obter equipamentos à venda de uma loja pelo NIPC
      parameters:
        - name: nipc
          in: path
          required: true
          schema:
            type: string
          description: NIPC da loja
      responses:
        '200':
          description: Lista de equipamentos à venda
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1001
                    estadovenda:
                      type: string
                      example: "À venda"
                    estado:
                      type: string
                      example: "Usado"
                    preco:
                      type: number
                      format: float
                      example: 299.99
                    numerosequencialoja:
                      type: string
                      example: "00123"
                    datadedisponibilizacao:
                      type: string
                      format: date-time
                      example: "2025-06-19T12:00:00Z"
                    codBarras:
                      type: string
                      example: "1234567890123"
                    marca:
                      type: string
                      example: "MarcaX"
                    modelo:
                      type: string
                      example: "ModeloY"
                    tipo:
                      type: string
                      example: "Smartphone"
                    precoBase:
                      type: number
                      format: float
                      example: 399.99
                    anoLancamento:
                      type: integer
                      example: 2023
        '500':
          description: Erro ao buscar equipamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao buscar equipamentos da loja"


  /clientes:
    get:
      summary: Obter lista de clientes com informações da pessoa
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    clienteId:
                      type: integer
                      example: 123
                    nome:
                      type: string
                      example: "João Silva"
                    email:
                      type: string
                      format: email
                      example: "joao.silva@example.com"
                    telefone:
                      type: string
                      example: "+351912345678"
        '500':
          description: Erro ao buscar clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Erro ao buscar clientes"

  /fichas:
    get:
      summary: Obter lista de fichas de equipamento
      responses:
        '200':
          description: Lista de fichas de equipamento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codBarras:
                      type: string
                      example: "1234567890123"
                    marca:
                      type: string
                      example: "Sony"
                    modelo:
                      type: string
                      example: "Alpha 7"
                    tipo:
                      type: string
                      example: "Câmera"
                    precoBase:
                      type: number
                      format: float
                      example: 1500.5
                    anoLancamento:
                      type: integer
                      example: 2021
                    url:
                      type: string
                      format: uri
                      example: "https://example.com/imagem.jpg"
        '500':
          description: Erro no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Criar uma nova ficha de equipamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codBarras
                - marca
                - modelo
                - tipo
                - precoBase
                - anoLancamento
              properties:
                codBarras:
                  type: string
                  description: Código de barras com 13 dígitos numéricos
                  example: "1234567890123"
                marca:
                  type: string
                  example: "Sony"
                modelo:
                  type: string
                  example: "Alpha 7"
                tipo:
                  type: string
                  example: "Câmera"
                precoBase:
                  type: number
                  format: float
                  example: 1500.5
                anoLancamento:
                  type: integer
                  example: 2021
      responses:
        '201':
          description: Ficha criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
